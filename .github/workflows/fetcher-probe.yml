name: Fetcher Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetcher-probe.yml"
      - "src/**"
      - "wrangler.toml"
      - "package.json"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare auto-deploy
        if: github.event_name == 'push'
        run: sleep 25

      - name: Probe Worker root
        continue-on-error: true
        run: |
          set -uxo pipefail
          curl -i --max-time 30 "https://sptracking-fetcher-probe.ekqtjl.workers.dev/"

      - name: Probe MamyPoko API
        run: |
          set -uxo pipefail
          curl -sS --max-time 30 \
            -w '\n__HTTP_STATUS__:%{http_code}\n' \
            "https://sptracking-fetcher-probe.ekqtjl.workers.dev/?shopid=50216086&itemid=845052410&modelid=1567087028" \
            | tee mamypoko-api.out
          cat mamypoko-api.out

      - name: Probe Hitachi API
        run: |
          set -uxo pipefail
          curl -sS --max-time 30 \
            -w '\n__HTTP_STATUS__:%{http_code}\n' \
            "https://sptracking-fetcher-probe.ekqtjl.workers.dev/?shopid=669016075&itemid=58155169453&modelid=315476033986" \
            | tee hitachi-api.out
          cat hitachi-api.out

      - name: Probe MamyPoko product page
        run: |
          set -uxo pipefail
          curl -sS --max-time 30 \
            -w '\n__HTTP_STATUS__:%{http_code}\n' \
            "https://sptracking-fetcher-probe.ekqtjl.workers.dev/?mode=page&shopid=50216086&itemid=845052410&modelid=1567087028" \
            | tee mamypoko-page.out
          cat mamypoko-page.out

      - name: Probe Hitachi product page
        run: |
          set -uxo pipefail
          curl -sS --max-time 30 \
            -w '\n__HTTP_STATUS__:%{http_code}\n' \
            "https://sptracking-fetcher-probe.ekqtjl.workers.dev/?mode=page&shopid=669016075&itemid=58155169453&modelid=315476033986" \
            | tee hitachi-page.out
          cat hitachi-page.out

      - name: Discover dynamic product endpoint from Shopee bundles
        run: |
          set -uxo pipefail
          curl -sS --max-time 90 \
            -w '\n__HTTP_STATUS__:%{http_code}\n' \
            "https://sptracking-fetcher-probe.ekqtjl.workers.dev/?mode=discover&shopid=50216086&itemid=845052410&modelid=1567087028" \
            | tee discover.out
          cat discover.out
