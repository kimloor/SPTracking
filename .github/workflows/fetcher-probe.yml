name: SPTracking Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetcher-probe.yml"
      - "src/**"
      - "browser-extension/**"
      - "wrangler.toml"
      - "package.json"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare auto-deploy
        if: github.event_name == 'push'
        run: sleep 25

      - name: Health
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 30 \
            "https://sptracking-fetcher-probe.ekqtjl.workers.dev/health"

      - name: Dashboard
        run: |
          set -euo pipefail
          code=$(curl -sS -o dashboard.html -w '%{http_code}' --max-time 30 \
            "https://sptracking-fetcher-probe.ekqtjl.workers.dev/")
          test "$code" = "200"
          grep -q "SPTracking" dashboard.html

      - name: Lookup tracked MamyPoko variation
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 30 \
            -H 'content-type: application/json' \
            -d '{"url":"https://shopee.co.th/-i.50216086.845052410?extraParams=%7B%22display_model_id%22%3A1567087028%7D"}' \
            "https://sptracking-fetcher-probe.ekqtjl.workers.dev/api/lookup" \
            | tee lookup.json
          python - <<'PY'
          import json
          data=json.load(open('lookup.json',encoding='utf-8'))
          assert data['ok'] is True
          assert str(data['model_id']) == '1567087028'
          assert data['current_price'] == 1390
          print('lookup ok:', data['variation_name'], data['current_price'])
          PY

      - name: Verify D1 history
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 30 \
            "https://sptracking-fetcher-probe.ekqtjl.workers.dev/api/history/50216086/845052410/1567087028?limit=10" \
            | tee history.json
          python - <<'PY'
          import json
          data=json.load(open('history.json',encoding='utf-8'))
          assert data['ok'] is True
          assert data['stats']['observations'] >= 1
          print('history observations:', data['stats']['observations'])
          PY
